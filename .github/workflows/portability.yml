name: Portable Python and hook tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Use Git Bash for subprocess tests on Windows
        if: runner.os == 'Windows'
        run: echo 'FORM_TOOLS_TEST_BASH=C:/Program Files/Git/bin/bash.exe' >> "$GITHUB_ENV"
      - run: bash -n pre-commit run-python
      - run: python -m unittest discover -s tests -p test_portability.py -v
